# Probe VRAM Whisper small, run percobaan Milestone 1 (Utang nomor 4).
# Mode --probe-vram tidak memakai per_device_train_batch_size maupun
# per_device_eval_batch_size; keduanya hanya pengisi agar konfigurasi lolos
# pemeriksaan. Nilai lain sama dengan konfigurasi pelatihan percobaan.
run_name: whisper_probe
model_family: whisper
pretrained: openai/whisper-small
train_subset: outputs/subsets/d1.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
learning_rate: 1.0e-5
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 6000
eval_steps: 250
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 25
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
generation_max_new_tokens: 128
model_overrides: {}
