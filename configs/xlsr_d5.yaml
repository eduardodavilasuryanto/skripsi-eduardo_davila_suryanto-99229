# Konfigurasi final Milestone 2: XLS-R 300M, D5 (66 jam), Utang nomor 4
# butir (g), Sesi 22, dibuat sesudah titik pembekuan milestone-1-pembekuan
# (5 Oktober 2026). Nilai pelatihan disalin dari
# configs/trial/xlsr_d1_trial.yaml, yang sekaligus menjadi konfigurasi D1
# (README bagian Konfigurasi D1); berkas ini hanya berbeda darinya pada
# run_name dan train_subset. Jangan disunting setelah dieksekusi.
# model_overrides mengikuti resep fine-tuning XLS-R Hugging Face;
# mask_time_prob 0,05 adalah regularisasi di dalam model, bukan augmentasi
# data.
run_name: xlsr_d5
model_family: xlsr
pretrained: facebook/wav2vec2-xls-r-300m
revision: 1a640f32ac3e39899438a2931f9924c02f080a54
train_subset: outputs/subsets/d5.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
learning_rate: 3.0e-4
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 10000
eval_steps: 250
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 25
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
model_overrides:
  attention_dropout: 0.0
  hidden_dropout: 0.0
  feat_proj_dropout: 0.0
  mask_time_prob: 0.05
  layerdrop: 0.0
  ctc_loss_reduction: mean
  ctc_zero_infinity: true
