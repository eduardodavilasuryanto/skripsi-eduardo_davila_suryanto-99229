# Konfigurasi final Milestone 2: Whisper small, D3 (10 jam), Utang nomor 4
# butir (g), Sesi 22, dibuat sesudah titik pembekuan milestone-1-pembekuan
# (5 Oktober 2026). Nilai pelatihan disalin dari
# configs/trial/whisper_d1_trial.yaml, yang sekaligus menjadi konfigurasi D1
# (README bagian Konfigurasi D1); berkas ini hanya berbeda darinya pada
# run_name dan train_subset. Jangan disunting setelah dieksekusi.
run_name: whisper_d3
model_family: whisper
pretrained: openai/whisper-small
revision: 973afd24965f72e36ca33b3055d56a652f456b4d
train_subset: outputs/subsets/d3.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
learning_rate: 1.0e-5
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 10000
eval_steps: 250
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 25
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
generation_max_new_tokens: 128
model_overrides: {}
