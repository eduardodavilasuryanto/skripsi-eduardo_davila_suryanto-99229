# Uji determinisme Whisper small, Utang nomor 4 butir (c) dan (e), Sesi 19.
# whisper_det_a.yaml dan whisper_det_b.yaml identik kecuali run_name; deret
# loss per langkah kedua run dibandingkan pada butir (e). Selain run_name,
# berbeda dari whisper_d1_trial.yaml hanya pada max_steps 30, eval_steps 30,
# dan logging_steps 1. load_config mewajibkan max_steps kelipatan eval_steps,
# sehingga validation dievaluasi sekali di akhir. Warmup 500 dipertahankan agar
# pengaturannya sama dengan run percobaan, sehingga ke-30 langkah berada pada
# fase warmup.
run_name: whisper_det_a
model_family: whisper
pretrained: openai/whisper-small
revision: 973afd24965f72e36ca33b3055d56a652f456b4d
train_subset: outputs/subsets/d1.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
learning_rate: 1.0e-5
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 30
eval_steps: 30
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 1
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
generation_max_new_tokens: 128
model_overrides: {}
