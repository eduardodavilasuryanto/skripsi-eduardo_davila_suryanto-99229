# Uji dugaan penyebab evaluasi lambat, DraftResearch.md Lampiran B.10, Sesi 19.
# Nilai identik dengan whisper_det_a.yaml kecuali run_name, sehingga
# perbedaannya dengan run whisper_det_a (commit 3b75917) hanya kode
# train_asr.py: memori tercadang dilepas sebelum dan sesudah setiap evaluasi,
# dan biaya evaluasi dicatat. Dugaan didukung bila evaluasi validation jauh
# lebih cepat daripada 3.112,9 detik dengan puncak VRAM di bawah anggaran.
run_name: whisper_evalmem
model_family: whisper
pretrained: openai/whisper-small
revision: 973afd24965f72e36ca33b3055d56a652f456b4d
train_subset: outputs/subsets/d1.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
learning_rate: 1.0e-5
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 30
eval_steps: 30
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 1
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
generation_max_new_tokens: 128
model_overrides: {}
