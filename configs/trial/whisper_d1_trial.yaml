# Run percobaan D1 Whisper small, Utang nomor 4 butir (c), Sesi 19.
# Nilai mengikuti Keputusan Metodologis I.3 poin 11: batch 16 x 2 akumulasi
# dan eval 32 dari probe VRAM, revisi model dikunci. max_steps 10.000
# ditetapkan Sesi 21 (butir f) sebelum run ini dieksekusi; jadwal linear
# membuat nilai itu ikut menentukan learning rate setiap langkah, sehingga
# run ini memakai nilai grid. Run ini tidak dipakai sebagai hasil Milestone 2;
# D1 dijalankan ulang setelah pembekuan.
run_name: whisper_d1_trial
model_family: whisper
pretrained: openai/whisper-small
revision: 973afd24965f72e36ca33b3055d56a652f456b4d
train_subset: outputs/subsets/d1.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
learning_rate: 1.0e-5
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 10000
eval_steps: 250
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 25
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
generation_max_new_tokens: 128
model_overrides: {}
