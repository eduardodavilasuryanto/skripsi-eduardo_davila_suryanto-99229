# Run percobaan D1 XLS-R 300M, Utang nomor 4 butir (c), Sesi 19.
# Nilai mengikuti Keputusan Metodologis I.3 poin 11: batch 2 x 16 akumulasi
# dan eval 2 dari probe VRAM (xlsr_probe dan xlsr_probe_eval), revisi model
# dikunci. max_steps 10.000 ditetapkan Sesi 21 (butir f) sebelum run ini
# dieksekusi; jadwal linear membuat nilai itu ikut menentukan learning rate
# setiap langkah, sehingga run ini memakai nilai grid. Run ini tidak dipakai
# sebagai hasil Milestone 2; D1 dijalankan ulang setelah pembekuan.
# model_overrides mengikuti resep fine-tuning XLS-R Hugging Face;
# mask_time_prob 0,05 adalah regularisasi di dalam model, bukan augmentasi
# data.
run_name: xlsr_d1_trial
model_family: xlsr
pretrained: facebook/wav2vec2-xls-r-300m
revision: 1a640f32ac3e39899438a2931f9924c02f080a54
train_subset: outputs/subsets/d1.tsv
validation_split: outputs/splits/validation.tsv
seed: 42
precision: bf16
tf32: false
deterministic: true
effective_batch_size: 32
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
learning_rate: 3.0e-4
warmup_steps: 500
lr_scheduler_type: linear
optim: adamw_torch
max_steps: 10000
eval_steps: 250
early_stopping_patience: 4
early_stopping_min_steps: 2000
gradient_checkpointing: true
logging_steps: 25
dataloader_num_workers: 4
save_only_model: true
keep_checkpoints: false
model_overrides:
  attention_dropout: 0.0
  hidden_dropout: 0.0
  feat_proj_dropout: 0.0
  mask_time_prob: 0.05
  layerdrop: 0.0
  ctc_loss_reduction: mean
  ctc_zero_infinity: true
